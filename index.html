<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sobre Games</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="logo/logo.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div id="Navbar">
<nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="#" id="logo-container"></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Inicio</a>
            </li>
            
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Categorias
              </a>
              <ul class="dropdown-menu" id="category-list">
                <!-- Categorias carregadas via JS -->
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Seja um membro</a>
            </li>
          </ul>
          <form class="d-flex" role="search" onsubmit="return redirectToSearchPage()">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Busque seu Jogo"
              aria-label="Search"
              id="search-input"
            />
            <button class="btn btn-outline-info" type="submit" id="buscar">Buscar</button>
          </form>
        </div>
      </div>
    </nav>
  </div>

  <section id="MaisJogados" class="container my-4" style="position: relative;">
    <h2 class="text-center mb-4 text-info">Mais Jogados</h2>
    <button id="scroll-left" class="scroll-button">&#8249;</button>
    <div id="popular-row" class="scroll-row">
      <!-- Cards populados por JS -->
    </div>
    <button id="scroll-right" class="scroll-button">&#8250;</button>
  </section>

  <section id="JogosRecentes" class="container my-4" style="position: relative;">
    <h2 class="text-center mb-4 text-success">Jogos Mais Recentes</h2>
    <button id="scroll-left-recent" class="scroll-button">&#8249;</button>
    <div id="recent-row" class="scroll-row">
      <!-- Cards populados por JS -->
    </div>
    <button id="scroll-right-recent" class="scroll-button">&#8250;</button>
  </section>

  <section id="JogosBemAvaliados" class="container my-4" style="position: relative;">
    <h2 class="text-center mb-4 text-warning">Jogos Mais Bem Avaliados</h2>
    <button id="scroll-left-rated" class="scroll-button">&#8249;</button>
    <div id="rated-row" class="scroll-row">
      <!-- Cards populados por JS -->
    </div>
    <button id="scroll-right-rated" class="scroll-button">&#8250;</button>
  </section>

  <section id="ProximosLancamentos" class="container my-4" style="position: relative;">
    <h2 class="text-center mb-4 text-danger">Próximos Lançamentos</h2>
    <button id="scroll-left-upcoming" class="scroll-button">&#8249;</button>
    <div id="upcoming-row" class="scroll-row">
      <!-- Cards populados por JS -->
    </div>
    <button id="scroll-right-upcoming" class="scroll-button">&#8250;</button>
  </section>

  <section id="JogosGratuitos" class="container my-4" style="position: relative;">
    <h2 class="text-center mb-4 text-primary">Jogos Gratuitos</h2>
    <button id="scroll-left-free" class="scroll-button">&#8249;</button>
    <div id="free-row" class="scroll-row">
      <!-- Cards populados por JS -->
    </div>
    <button id="scroll-right-free" class="scroll-button">&#8250;</button>
  </section>

  <script src="logo/logo.js"></script>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
