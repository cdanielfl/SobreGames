<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Busca - Sobre Games</title>
  <link rel="stylesheet" href="../style.css" />
   <link rel="stylesheet" href="logo/logo.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div id="Navbar">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html" id="logo-container"></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Os Mais Jogados</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Categorias
              </a>
              <ul class="dropdown-menu" id="category-list">
                <!-- Categorias carregadas via JS -->
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Seja um membro</a>
            </li>
          </ul>
          <form class="d-flex" role="search" onsubmit="return redirectToSearchPage()">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Busque seu Jogo"
              aria-label="Search"
              id="search-input"
            />
            <button class="btn btn-outline-info" type="submit" id="buscar">Buscar</button>
          </form>
        </div>
      </div>
    </nav>
  </div>

  <section id="search-section" class="container my-4" style="position: relative;">
    <h2 class="text-center mb-4 text-info">Resultados da Busca</h2>
<div id="search-results" style="display: flex; flex-wrap: wrap; gap: 15px;">
      <!-- Resultados carregados aqui -->
</div>
  </section>
  <script src="logo/logo.js"></script>
  <script src="search.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
